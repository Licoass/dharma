<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="dharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F766E" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="192" height="192" rx="46" fill="url(#dharmaGrad)"/>
  
  <!-- Outer aura ring -->
  <circle cx="96" cy="96" r="54" fill="none" stroke="#5EEAD4" stroke-width="3" opacity="0.4"/>
  
  <!-- Dharma Core circular glyph -->
  <circle cx="96" cy="96" r="42" fill="#F0FDFA" filter="url(#shadow)"/>
  <circle cx="96" cy="96" r="22" fill="#0D9488"/>
  <circle cx="96" cy="96" r="10" fill="#F0FDFA"/>
  
  <!-- Spark accent -->
  <circle cx="122" cy="70" r="7" fill="#5EEAD4"/>
</svg>
